# Phase 1 — Posting schedule
# Defaults from CLAUDE.md "Posting cadence". Optimizer can shift +/- 60 min
# per optimizer_bounds.yaml.

timezone: America/New_York   # US Eastern per operator default

# === Posting mode per platform (operator decision 2026-05-14) ===
# - api:    Publisher uploads directly via the platform's official API.
# - manual: Publisher writes the finished MP4 + caption + hashtags to a drop
#           directory and marks the queue row 'manual_pending'. Operator
#           uploads via the platform's native app/desktop client, then runs
#           `make tiktok-confirm CLIP_ID=<id> POST_ID=<id>` (or platform-
#           specific equivalent) to mark the row 'posted'. See docs/runbook.md
#           Step 7 for the daily TikTok workflow.
#
# TikTok is manual because the Content Posting API audit is brutal (4-8wk,
# high rejection for solo operators) and automated TikTok uploads are
# widely reported as algorithmically suppressed. Re-evaluate at month 3.

platforms:
  tiktok:
    mode: manual
    manual_drop_directory: data/clips/output/manual_upload/tiktok
    posts_per_day: 3
    times:
      - "07:00"
      - "12:00"
      - "20:00"
    weekend_boost:
      enabled: true
      posts_per_day: 4
      extra_time: "23:00"

  instagram_reels:
    mode: api
    posts_per_day: 2
    times:
      - "11:00"
      - "19:00"

  youtube_shorts:
    mode: api
    posts_per_day: 2
    times:
      - "12:00"
      - "21:00"

# Total: 7 posts/day weekday, 8 posts/day weekend
# Each clip reformatted per platform (aspect ratio, caption density, hashtag set)
# rather than producing separate pipelines.

reformatting:
  per_platform:
    tiktok:
      aspect_ratio: "9:16"
      max_duration_s: 58
      caption_density: high       # word-level, animated emphasis
      hashtags_count: [3, 5]      # min, max
    instagram_reels:
      aspect_ratio: "9:16"
      max_duration_s: 58
      caption_density: medium
      hashtags_count: [5, 10]
    youtube_shorts:
      aspect_ratio: "9:16"
      max_duration_s: 58
      caption_density: medium
      hashtags_count: [2, 4]
      title_must_contain: "#Shorts"

# Quota-aware throttling (read from posting_apis.md)
quota_guards:
  youtube:
    api: youtube_data_api_v3
    daily_quota_units: 10000
    cost_per_upload_units: 1600
    max_uploads_per_day: 6        # 9600 units; leaves headroom for read calls
  tiktok:
    api: not_used   # operator chose manual mode 2026-05-14; see platforms.tiktok.mode above
    manual_daily_cap: 4              # safety: never queue more than this for manual upload
    fallback: none                   # no API fallback; manual is the production path
  instagram:
    api: instagram_graph_api
    daily_post_limit: 50          # current limit; queryable via content_publishing_limit
    reels_max_duration_s: 90
